[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-monitor"
version = "1.0.0"
description = "Advanced OSINT Social Media Monitoring and Intelligence Gathering Tool"
readme = "README.md"
requires-python = ">=3.7"
authors = [{name = "nrk8286", email = "nrk8286@gmail.com"}]

keywords = [
    "osint", "social-media", "monitoring", "intelligence",
    "reconnaissance", "security", "research", "twitter",
    "google", "web-scraping"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "googlesearch-python>=1.2.3",
    "tweepy>=4.14.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/nrk8286/osint-app"
Documentation = "https://github.com/nrk8286/osint-app#readme"
Repository = "https://github.com/nrk8286/osint-app.git"
"Bug Tracker" = "https://github.com/nrk8286/osint-app/issues"
